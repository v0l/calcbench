[package]
name = "calcbench"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Units, constants, formulas and a calculator for builders"
repository = "https://github.com/v0l/calcbench"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "calcbench"
path = "src/main.rs"

[dependencies]
egui = "0.37"
egui_bench = "0.9.4"
fend-core = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "clipboard", "links", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "thin"
