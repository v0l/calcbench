vars = [
  { s = "Z0", n = "impedance", u = "ohm", x = 50.0 },
  { s = "er", n = "relative permittivity", x = 4.4 },
  { s = "h", n = "dielectric height", x = 0.2 },
  { s = "w", n = "trace width", x = 0.35 },
  { s = "t", n = "copper thickness", x = 0.035 },
]

[[formula]]
id = "stripline-impedance"
name = "Stripline impedance"
tags = "transmission line stripline pcb impedance"
equation = "Z0 = 60/sqrt(er)*ln(4*b/(0.67*pi*(0.8*w + t)))"
notes = "b is the plane to plane spacing. Valid for w/b below 0.35."
source = "IPC-2141"
vars = [
  { s = "Z0", n = "impedance", u = "ohm", x = 50.0 },
