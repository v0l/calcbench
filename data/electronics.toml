[[formula]]
id = "microstrip-impedance"
name = "Microstrip impedance"
tags = "transmission line microstrip pcb impedance"
equation = "Z0 = 87/sqrt(er + 1.41)*ln(5.98*h/(0.8*w + t))"
notes = "Valid for 0.1 < w/h < 2 and er below 15. w, h and t share any length unit."
